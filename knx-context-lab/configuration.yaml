homeassistant:
  name: KNX Activity Lab
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: Europe/Berlin
  country: DE
  currency: EUR
frontend:
api:
http:
config:
history:
logbook:
recorder:
  commit_interval: 1
logger:
  default: warning
  logs:
    homeassistant.components.knx: info
    xknx: info
knx:
  light:
    - name: Lab light
      address: "1/1/1"
      state_address: "1/1/2"
      brightness_address: "1/1/3"
      brightness_state_address: "1/1/4"
  switch:
    - name: Lab trigger
      address: "3/0/1"
  cover:
    - name: Lab cover
      move_long_address: "2/0/1"
      stop_address: "2/0/2"
      position_state_address: "2/0/4"
      travelling_time_down: 16
      travelling_time_up: 16
automation:
  - id: knx_context_lab
    alias: KNX switch moves cover
    triggers:
      - trigger: state
        entity_id: switch.lab_trigger
        to: "on"
    actions:
      - action: cover.set_cover_position
        target:
          entity_id: cover.lab_cover
        data:
          position: 50
rest_command:
  knx_lab_trigger:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.23","group":"3/0/1","value":1}'
  knx_lab_reset:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.10","group":"2/0/4","value":0,"response":true}'
  knx_lab_cover_down:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.24","group":"2/0/1","value":1}'

  knx_lab_on:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.23","group":"1/1/1","value":1}'
  knx_lab_off:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.23","group":"1/1/1","value":0}'
  knx_lab_unknown:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.24","group":"1/1/1","value":1}'
  knx_lab_actuator:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.10","group":"1/1/2","value":0,"response":true}'
  knx_lab_dim:
    url: http://127.0.0.1:8080/telegram
    method: POST
    content_type: application/json
    payload: '{"source":"1.1.23","group":"1/1/4","value":100}'
lovelace:
  mode: yaml
